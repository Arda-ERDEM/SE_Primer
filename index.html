<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#052767" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>HBYS.Primer.Web - Klinik Nöbet ve Karar Simülasyonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #e9ecef;
        color: #212529;
        font-size: 14px;
        line-height: 1.45;
      }
      code, pre, .font-mono {
        font-family: Consolas, "Courier New", monospace;
      }
      .blazor-top-row {
        background-image: linear-gradient(90deg, #052767 0%, #3a0647 75%);
        border-bottom: 1px solid #d6d5d5;
      }
      .blazor-card {
        background-color: #ffffff;
        border: 1px solid #ced4da;
        border-radius: 3px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .blazor-card-header {
        background-color: #f8f9fa;
        border-bottom: 1px solid #ced4da;
        padding: 8px 12px;
        font-weight: 600;
        color: #343a40;
      }
      .blazor-btn-primary {
        background-color: #1b6ec2;
        border: 1px solid #1861ac;
        color: #ffffff;
        border-radius: 3px;
      }
      .blazor-btn-primary:hover {
        background-color: #155a9e;
      }
    </style>
  </head>
  <body class="bg-[#e9ecef] text-[#212529] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
